<div class="contenedor">

  <h1>GMPerfumería</h1>

  <p class="subtitulo">
    Elegancia y aroma en cada compra
  </p>

  <div class="tarjeta">

    <h2>Pago de pedido</h2>

    <p class="importe">
      Importe: <strong>$500 MXN</strong>
    </p>

    @if (cargando) {
      <p class="mensaje">
        Preparando pago...
      </p>
    }

    <div id="payment-element"></div>

    @if (mensaje) {
      <p class="mensaje">
        {{ mensaje }}
      </p>
    }

    @if (!pagoExitoso) {
      <button
        type="button"
        (click)="pagar()">
        Pagar $500 MXN
      </button>
    }

    @if (pagoExitoso) {
      <div class="pago-confirmado">
        <p>✓ Pago completado correctamente</p>
        <p>Monto pagado: $500 MXN</p>
      </div>
    }

  </div>

</div>
