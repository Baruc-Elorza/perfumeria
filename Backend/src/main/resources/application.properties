spring.application.name=perfumeria

# Puerto donde correrá la API
server.port=8080

# Conexión a la base de datos MySQL
spring.datasource.url=jdbc:mysql://localhost:3306/perfumeria_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=angel2004
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración de JPA y Hibernate para crear/actualizar tablas automáticamente
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true