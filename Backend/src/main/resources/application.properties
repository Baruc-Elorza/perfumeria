# Nombre de la aplicación
spring.application.name=perfumeria-backend

# Puerto del servidor backend
server.port=8080

# Configuración de Conexión a MySQL
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/perfumeria}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuración del Pool de Conexiones (Hikari)
spring.datasource.hikari.maximum-pool-size=20
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=60000
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.max-lifetime=1800000

# Configuración de JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# HU-13: el envío se activa únicamente al configurar SMTP y destinatario.
notificaciones.compra.habilitadas=${COMPRA_EMAIL_ENABLED:false}
notificaciones.compra.destinatario=${COMPRA_EMAIL_ADMIN:}
notificaciones.compra.remitente=${COMPRA_EMAIL_FROM:}
notificaciones.compra.intervalo-ms=30000
spring.mail.host=${MAIL_HOST:localhost}
spring.mail.port=${MAIL_PORT:1025}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=${MAIL_AUTH:false}
spring.mail.properties.mail.smtp.starttls.enable=${MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.starttls.required=${MAIL_STARTTLS:false}
spring.mail.properties.mail.smtp.ssl.enable=${MAIL_SSL:false}
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000
# Stripe: variables de entorno o archivo privado en la carpeta Backend.
# Ejecutar el backend desde Backend para cargar el archivo local.
spring.config.import=optional:file:./application-local.properties
stripe.public.key=${STRIPE_PUBLIC_KEY}
stripe.secret.key=${STRIPE_SECRET_KEY}
